name: Validate plugin

on:
  push:
    branches: [ main, next ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate marketplace & plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # jq and node are preinstalled on ubuntu-latest runners.

      - name: Validate marketplace.json
        run: |
          MP=.claude-plugin/marketplace.json
          echo "→ $MP"
          jq empty "$MP"
          for f in name owner owner.name plugins; do
            jq -e ".$f" "$MP" >/dev/null || { echo "✗ missing marketplace field: $f"; exit 1; }
          done
          jq -e '.plugins | type == "array"' "$MP" >/dev/null || { echo "✗ .plugins must be an array"; exit 1; }
          echo "✓ marketplace.json valid"

      - name: No duplicate plugin names
        run: |
          dups=$(jq -r '.plugins[].name' .claude-plugin/marketplace.json | sort | uniq -d)
          [ -z "$dups" ] || { echo "✗ duplicate plugin names: $dups"; exit 1; }
          echo "✓ no duplicate plugin names"

      - name: Validate each plugin
        run: |
          # Iterate string-source plugins declared in the marketplace.
          jq -r '.plugins[] | select(.source | type == "string") | .source' \
            .claude-plugin/marketplace.json | while read -r src; do
            echo "→ plugin at $src"
            [ -d "$src" ] || { echo "✗ dir not found: $src"; exit 1; }
            pj="$src/.claude-plugin/plugin.json"
            [ -f "$pj" ] || { echo "✗ plugin.json not found: $pj"; exit 1; }
            jq empty "$pj" || { echo "✗ invalid JSON: $pj"; exit 1; }
            jq -e '.name' "$pj" >/dev/null || { echo "✗ plugin.json missing 'name'"; exit 1; }
            [ -f "$src/README.md" ] || echo "⚠️  no README.md in $src (recommended)"
            echo "✓ $src plugin.json valid"
          done

      - name: Validate skill frontmatter
        run: |
          fail=0
          while IFS= read -r skill; do
            head -n1 "$skill" | grep -q '^---$' || { echo "✗ $skill: no frontmatter"; fail=1; continue; }
            fm=$(awk 'NR>1 && /^---$/{exit} NR>1{print}' "$skill")
            echo "$fm" | grep -q '^name:'        || { echo "✗ $skill: frontmatter missing 'name'"; fail=1; }
            echo "$fm" | grep -q '^description:'  || { echo "✗ $skill: frontmatter missing 'description'"; fail=1; }
          done < <(find plugins -name SKILL.md)
          [ "$fail" -eq 0 ] && echo "✓ all SKILL.md frontmatter valid"
          exit $fail

      - name: Validate agent frontmatter
        run: |
          fail=0
          while IFS= read -r agent; do
            head -n1 "$agent" | grep -q '^---$' || { echo "✗ $agent: no frontmatter"; fail=1; }
          done < <(find plugins -path '*/agents/*.md')
          [ "$fail" -eq 0 ] && echo "✓ all agent files have frontmatter"
          exit $fail

      - name: Syntax-check workflow scripts
        run: |
          fail=0
          # Workflow scripts run inside an async function (top-level await and
          # return are allowed there), so check them wrapped the same way.
          tmp="$RUNNER_TEMP/wf-check.js"
          while IFS= read -r js; do
            { echo '(async () => {'; sed 's/^export const meta/const meta/' "$js"; echo '})'; } > "$tmp"
            node --check "$tmp" && echo "✓ $js" || { echo "✗ syntax error: $js"; fail=1; }
          done < <(find plugins -path '*/workflows/*.js')
          exit $fail

  directory-check:
    name: Anthropic directory check
    runs-on: ubuntu-latest
    env:
      # Pinned so a new CLI release can't change the result without notice.
      # Raise it now and then (npm view @anthropic-ai/claude-code version).
      CLAUDE_CODE_VERSION: "2.1.316"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      # Runs the local subset of the checks Anthropic's plugin directory runs.
      # No login or API key is needed; --strict fails on warnings too.
      - name: claude plugin validate --profile directory --strict
        run: claude plugin validate plugins/where-to-plai --profile directory --strict

  render-test:
    name: Worksheet view renders (Python ${{ matrix.python }})
    # ubuntu-24.04 still offers Python 3.9, the oldest version the renderer supports.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: [ "3.9", "3.13" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # A fresh Python with nothing installed: Jinja2 and MarkupSafe must come
      # from the plugin's own _vendor/ folder.
      - name: Render the example data
        run: |
          R=plugins/where-to-plai/skills/worksheet-view/renderer
          python -c "import jinja2" 2>/dev/null && { echo "✗ jinja2 is installed on the runner; the test would not prove the vendored copy works"; exit 1; }
          python "$R/render.py" "$R/wtp-data.example.json" "$RUNNER_TEMP/navigator"

      - name: Check the output
        run: |
          OUT="$RUNNER_TEMP/navigator"
          fail=0
          for f in overview.html ws1.html ws2.html ws3.html css/bootstrap.css css/app.css; do
            [ -s "$OUT/$f" ] && echo "✓ $f" || { echo "✗ missing or empty: $f"; fail=1; }
          done
          ls "$OUT"/fonts/*.woff2 >/dev/null 2>&1 && echo "✓ fonts copied" || { echo "✗ no fonts copied"; fail=1; }
          [ -d "$OUT/assets" ] && echo "✓ assets copied" || { echo "✗ assets not copied"; fail=1; }
          for p in overview ws1 ws2 ws3; do
            grep -q 'css/bootstrap.css' "$OUT/$p.html" && grep -q 'css/app.css' "$OUT/$p.html" \
              || { echo "✗ $p.html does not link both stylesheets"; fail=1; }
          done
          find plugins -name __pycache__ | grep -q . && { echo "✗ the renderer left __pycache__ in the plugin"; fail=1; }
          exit $fail

  version-check:
    name: Versions consistent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: plugin.json, marketplace.json, READMEs, CHANGELOG and tag agree
        run: |
          fail=0
          V=$(jq -r '.version' plugins/where-to-plai/.claude-plugin/plugin.json)
          M=$(jq -r '.version' .claude-plugin/marketplace.json)
          echo "plugin.json: $V · marketplace.json: $M"
          [ "$V" = "$M" ] || { echo "✗ plugin.json and marketplace.json versions differ"; fail=1; }
          grep -q "^## \[$V\]" plugins/where-to-plai/CHANGELOG.md \
            && echo "✓ CHANGELOG has a [$V] section" || { echo "✗ CHANGELOG has no '## [$V]' section"; fail=1; }
          for r in README.md plugins/where-to-plai/README.md; do
            grep -q "version $V\*\*" "$r" && echo "✓ $r says version $V" || { echo "✗ $r status line doesn't say version $V"; fail=1; }
          done
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            T="${GITHUB_REF#refs/tags/v}"
            [ "$T" = "$V" ] && echo "✓ tag v$T matches" || { echo "✗ tag v$T doesn't match version $V"; fail=1; }
          fi
          exit $fail
